# ==========================================
# Application
# ==========================================

spring.application.name=backend

# ==========================================
# GitHub OAuth Configuration
# ==========================================

github.client-id=${GITHUB_CLIENT_ID}
github.client-secret=${GITHUB_CLIENT_SECRET}

# Legacy redirect URI for older extension versions
github.redirect-uri=${GITHUB_REDIRECT_URI}

# Browser-specific redirect URIs for newer extension versions
github.allowed-redirect-uris=${GITHUB_ALLOWED_REDIRECT_URIS}

# ==========================================
# Chrome Extension Configuration
# ==========================================

extension.allowed-origin=${EXTENSION_ALLOWED_ORIGIN}